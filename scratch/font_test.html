<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    body { background: #ffffff; padding: 40px; font-size: 40px; }
    .row { margin-bottom: 30px; }
    .label { font-size: 16px; color: #666; font-family: sans-serif; margin-bottom: 5px; }
    .times { font-family: 'Times New Roman', Times, serif; font-weight: bold; }
    .cinzel { font-family: 'Cinzel', serif; font-weight: 700; }
    .georgia { font-family: Georgia, serif; font-weight: bold; }
  </style>
</head>
<body>
  <div class="row">
    <div class="label">Original Image Reference:</div>
    <img src="/public/assets/logo.png" style="height: 50px;">
  </div>
  <div class="row">
    <div class="label">Times New Roman Bold:</div>
    <div class="times">DR W RANG</div>
  </div>
  <div class="row">
    <div class="label">Cinzel 700:</div>
    <div class="cinzel">DR W RANG</div>
  </div>
  <div class="row">
    <div class="label">Georgia Bold:</div>
    <div class="georgia">DR W RANG</div>
  </div>
</body>
</html>
